<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#000000"><title>日序 · 个人计划与开销</title><link rel="stylesheet" href="style.css?v=4"></head>
<body>
<header class="topbar"><a class="brand" href="#">日序<span>DAY BY DAY</span></a><nav aria-label="主导航"><button class="tab active" data-view="plan">计划 <span>01</span></button><button class="tab" data-view="money">开销 <span>02</span></button></nav><span class="header-spacer"></span></header>
<main>
<section id="plan" class="view">
<div class="heading"><h1>计划</h1><button class="primary" id="new-task">＋ 添加任务</button></div>
<div class="today-progress"><div class="progress-heading"><label for="today-bar">今日进度</label><span id="today-count"></span></div><div id="today-bar" role="progressbar" aria-label="今日计划完成程度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div id="today-fill"></div></div></div>
<div class="board-toolbar"><div class="week-switch"><button id="prev-week" aria-label="上一周">←</button><h2 id="week-label"></h2><button id="next-week" aria-label="下一周">→</button><button id="this-week" class="small">本周</button></div><div class="gesture-hint"><span>← 未完成</span><span>右划完成 →</span></div></div>
<div class="board" id="board"></div><div class="board-footer"><span id="progress"></span></div>
</section>
<section id="money" class="view" hidden>
<div class="heading"><h1>开销</h1><button class="primary" id="new-expense">＋ 记一笔</button></div>
<div class="stats"><article class="stat"><p>总资产 <button id="edit-assets" class="text-button">设置 ↗</button></p><h2 id="assets-value"></h2><small>你设定的起始资产</small></article><article class="stat"><p>剩余资产</p><h2 id="balance-value"></h2><small>总资产 − 全部已记录开销</small></article><article class="stat"><p>本周开销</p><h2 id="week-value"></h2><small>周一至周日</small></article><article class="stat"><p>本月开销</p><h2 id="month-value"></h2><small id="month-caption"></small></article></div>
<div class="finance-grid"><article class="panel"><div class="panel-title"><h2>开销明细</h2><span id="expense-total"></span></div><div id="expense-list"></div></article><article class="panel"><div class="panel-title"><h2>本月消费分类</h2><span>按金额</span></div><div id="categories"></div></article></div>
</section>
<footer><span>日序 / PERSONAL SPACE</span><span>数据仅保存在当前浏览器 · <button id="export-data" class="text-button">导出备份 ↗</button> <button id="import-data" class="text-button">导入备份</button><input id="import-file" type="file" accept="application/json" hidden></span></footer>
</main>
<dialog id="task-dialog"><form id="task-form"><div class="dialog-heading"><h2>添加任务</h2><button type="button" class="close" aria-label="关闭">×</button></div><label>任务名称<input name="title" required maxlength="100" placeholder="任务名称" autocomplete="off"></label><div class="form-row"><label>日期<input name="date" type="date" required></label><label>时间（可选）<input name="time" type="time"></label></div><label>备注（可选）<textarea name="note" maxlength="300" placeholder="备注"></textarea></label><p class="color-hint">卡片按任务名称自动配色，相同名称使用同一颜色。</p><button class="primary full" type="submit">添加到计划</button></form></dialog>
<dialog id="asset-dialog"><form id="asset-form"><div class="dialog-heading"><h2>设置总资产</h2><button type="button" class="close" aria-label="关闭">×</button></div><p class="subtitle">输入起始资产，已记录的开销会从中扣除。</p><label>总资产（元）<input name="amount" type="number" min="0" max="999999999" step="0.01" required placeholder="0.00"></label><button class="primary full">保存资产</button></form></dialog>
<dialog id="expense-dialog"><form id="expense-form"><div class="dialog-heading"><h2>添加开销</h2><button type="button" class="close" aria-label="关闭">×</button></div><label>消费内容<input name="title" required maxlength="100" placeholder="例如：午餐、地铁、买书"></label><div class="form-row"><label>金额（元）<input name="amount" type="number" min="0.01" max="999999999" step="0.01" required placeholder="0.00"></label><label>日期<input name="date" type="date" required></label></div><label>开销类型<select name="category" id="category-select"></select></label><button class="primary full">保存开销</button></form></dialog>
<div id="toast" role="status" hidden></div><script type="module" src="app.js?v=4"></script>
</body></html>
